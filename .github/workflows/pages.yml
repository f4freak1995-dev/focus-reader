name: Publish Focus Reader website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout website only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare approved public files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-english.py
          mkdir -p _site
          for file in index.html styles.css site.js language.js icon.svg copyright.html third-party.html privacy.html release-manifest.json README.md LICENSE.txt THIRD_PARTY_NOTICES.md DEPENDENCY_LICENSES.txt .nojekyll en/index.html en/copyright.html en/third-party.html en/privacy.html; do
            test -f "$file"
            test ! -L "$file"
            mkdir -p "_site/$(dirname "$file")"
            cp "$file" "_site/$file"
          done
          mkdir -p _site/assets
          for file in site.js language.js styles.css; do
            stem="${file%.*}"
            suffix="${file##*.}"
            version="$(sha256sum "$file" | cut -c1-12)"
            asset="assets/$stem.$version.$suffix"
            test -f "$asset"
            test ! -L "$asset"
            cp "$asset" "_site/$asset"
          done
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
